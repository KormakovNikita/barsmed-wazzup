services:
  hubdesk:
    build: .
    restart: unless-stopped
    # Host network: SOCKS5 proxy whitelists server public IP; bridge NAT breaks auth.
    network_mode: host
    env_file:
      - .env.local
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      - hubdesk-data:/app/.data

volumes:
  hubdesk-data:
